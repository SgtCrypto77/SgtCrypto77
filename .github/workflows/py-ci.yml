name: py-ci
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install ingestion deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/py/requirements.txt
      - name: Import check
        run: python - <<'PY'
import spacy
m=spacy.load("en_core_sci_sm")
print("Loaded:", m)
PY
